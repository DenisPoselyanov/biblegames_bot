name: Sync Phase 6 monetization docs

on:
  push:
    branches:
      - agent/unify-product-documentation
    paths:
      - .github/workflows/docs-monetization-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-product-documentation
          fetch-depth: 0

      - name: Patch canonical specification
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/BIBLE_GAMES_MASTER_SPECIFICATION.md")
          text = path.read_text(encoding="utf-8")

          goal = "Перебудувати магазин на прозору server-authoritative систему та підготувати безпечну монетизацію без pay-to-win.\n"
          goal_addition = """

Детальний перелік варіантів, ризиків, Telegram-specific вимог і decision framework знаходиться в [`MONETIZATION_STRATEGY.md`](./MONETIZATION_STRATEGY.md).

Ця фаза **не обирає конкретну бізнес-модель автоматично**. До production-реалізації власник продукту затверджує окремий ADR у `DECISIONS.md`. До цього дозволені лише sandbox/prototype інтеграції під feature flag.
"""
          if "Детальний перелік варіантів, ризиків, Telegram-specific вимог" not in text:
              if goal not in text:
                  raise SystemExit("Phase 6 goal marker not found")
              text = text.replace(goal, goal + goal_addition, 1)

          marker = "<!-- PHASE_6_MONETIZATION_OPTIONS -->"
          section = """
## Monetization options and decision gate

<!-- PHASE_6_MONETIZATION_OPTIONS -->

На етапі Phase 6 оцінюються такі моделі. Жодна з них не вважається затвердженою лише через наявність у специфікації.

### 1. Official Telegram Ads revenue sharing

- пасивна частка доходу від sponsored messages, які Telegram може показувати в чаті з ботом;
- eligibility, рекламний інвентар, покази й platform policy контролює Telegram;
- не використовується як гарантоване або основне джерело виручки;
- не імітується власними блоками всередині Mini App;
- перед активацією перевіряються актуальні Terms і доступні brand-safety controls.

### 2. Одноразові цифрові покупки через Telegram Stars

- cosmetics, themes, avatars, badges, profile frames і supporter bundles;
- optional supportive features без переваги у ranked або multiplayer режимах;
- server-generated order та ціна `XTR`;
- verified payment update;
- idempotent transaction;
- atomic entitlement grant;
- restore, refund/reversal і audit.

### 3. Paid subscriptions через Telegram Stars

Можливі, але не затверджені tiers:

- `Free` — повноцінний базовий learning core;
- `Premium` — розширена статистика, optional tools, cosmetics і додаткові персональні можливості;
- `Church/Classroom` — приватні групи, roles, власні question sets, presenter, Kahoot host tools, assignments, organization analytics та audit.

Subscription потребує server-authoritative lifecycle, renewal/expiry reconciliation, cancel/restore flow, plan versioning і зрозумілих recurring terms.

### 4. Telegram Affiliate Program

- канали, автори, служителі, користувачі або інші Mini Apps можуть отримувати комісію у Stars за покупки приведених користувачів;
- запускається лише після стабільних Stars purchases;
- commission rate і duration публічні;
- потрібні attribution, abuse detection, refund handling і unit economics;
- заборонені spam, self-referral abuse і богословсько маніпулятивні рекламні обіцянки.

### 5. Curated sponsorships

- лише вручну перевірені християнські видавництва, магазини Біблій, коледжі, конференції, табори та сумісні проєкти;
- sponsor content чітко позначений;
- дозволені окремі cards, partner section або placement після завершеної навчальної сесії;
- заборонені interstitial перед відповіддю, поверх біблійного тексту або прихована реклама;
- потрібні contract, age/content policy, frequency cap, privacy review і kill switch.

### 6. Окремий Telegram-канал Bible Games

- acquisition, вірш дня, нові плани, community updates і product announcements;
- можливі paid media, suggested posts, sponsor posts і platform revenue sharing за актуальними умовами Telegram;
- канал не є обов’язковою умовою доступу до core learning;
- channel revenue і analytics ведуться окремо від Mini App.

### 7. Third-party ad networks у Telegram WebView

- статус: **відкладено / experimental**;
- не реалізовується за замовчуванням;
- ризики: privacy, cookies/consent, brand safety, неповнолітні, WebView compatibility, performance і policy conflicts;
- потребує окремого ADR, legal review, allowlist categories, consent management, cross-platform tests і stop conditions.

## Internal coins vs Telegram Stars

Це дві незалежні системи:

- внутрішні монети — server-authoritative gameplay reward без обіцянки грошової вартості, виведення або зворотної конвертації;
- Telegram Stars — payment instrument із окремим transaction/revenue ledger;
- Stars не записуються в `coinBalance`;
- внутрішні монети не підтверджують оплату;
- будь-яка конвертація між ними заборонена без нового ADR і legal review.

## Monetization ADR

Перед production launch ADR повинен визначити:

- обрану модель або комбінацію моделей;
- гарантований free core;
- products і pricing;
- Premium/Church tiers;
- Ads/sponsor policy;
- minor protection;
- refund і subscription policy;
- країни запуску та legal/privacy obligations;
- unit economics після platform/affiliate costs;
- success metrics, stop conditions і operational owner.

## Evaluation order

1. За потреби пройти beta без monetization.
2. Стабілізувати internal economy та entitlements.
3. Перевірити sandbox one-time Stars purchase.
4. Оцінити cosmetics/supporter bundle без pay-to-win.
5. Окремо змоделювати Premium і Church plans.
6. Після стабільних purchases оцінити affiliate program.
7. Перевірити фактичну Telegram Ads eligibility без залежності від Ads revenue.
8. Curated sponsorships запускати лише після brand-safety policy.
9. Generic third-party ads залишити останнім необов’язковим варіантом.

"""
          if marker not in text:
              needle = "## Real payments\n\n"
              if needle not in text:
                  raise SystemExit("Real payments marker not found")
              text = text.replace(needle, section + needle, 1)

          acceptance_marker = "- є rollback/disable switch.\n"
          acceptance_addition = """
- internal coins і Telegram Stars не змішуються;
- production monetization має затверджений ADR;
- free learning core і no-pay-to-win policy перевірені;
- Ads і sponsorships clearly labeled;
- minor protection і legal/privacy review пройдені;
- кожна monetization model має окремий feature flag і kill switch;
"""
          if "- production monetization має затверджений ADR;" not in text:
              if acceptance_marker not in text:
                  raise SystemExit("Phase 6 acceptance marker not found")
              text = text.replace(acceptance_marker, acceptance_marker + acceptance_addition, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/docs-monetization-sync.yml

      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BIBLE_GAMES_MASTER_SPECIFICATION.md .github/workflows/docs-monetization-sync.yml
          git commit -m "docs: integrate monetization options into phase 6 [skip ci]"
          git push origin HEAD:agent/unify-product-documentation
