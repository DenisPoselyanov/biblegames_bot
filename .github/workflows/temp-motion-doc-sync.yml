name: Temporary motion documentation sync

on:
  push:
    branches:
      - agent/unify-product-documentation

permissions:
  contents: write

jobs:
  sync-motion-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-product-documentation
          fetch-depth: 0

      - name: Synchronize motion requirements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def insert_once(path: str, anchor: str, insertion: str, *, before: bool = True):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if insertion.strip() in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'Anchor not found in {path}: {anchor[:100]!r}')
              replacement = insertion + anchor if before else anchor + insertion
              p.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Replacement anchor not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          master = 'docs/BIBLE_GAMES_MASTER_SPECIFICATION.md'

          replace_once(
              master,
              '5. `DESIGN_RULES.md` — доменне джерело правди лише для дизайн-системи.\n6. `archive/DESIGN_AUDIT.md`',
              '5. `DESIGN_RULES.md` — доменне джерело правди лише для дизайн-системи.\n6. `MOTION_SYSTEM.md` — доменне джерело правди для transitions, feedback, celebrations, reduced motion, authoritative triggers і motion QA.\n7. `archive/DESIGN_AUDIT.md`'
          )
          # Renumber the remaining hierarchy entries only in the first hierarchy block.
          p = Path(master)
          t = p.read_text(encoding='utf-8')
          t = t.replace('7. `SUPABASE_SETUP.md`, `AI_SETUP.md`, `LOCAL_TOOLS.md`, `DEVELOPER_GUIDE.md`', '8. `SUPABASE_SETUP.md`, `AI_SETUP.md`, `LOCAL_TOOLS.md`, `DEVELOPER_GUIDE.md`', 1)
          t = t.replace('8. `archive/implementation_plan.md`', '9. `archive/implementation_plan.md`', 1)
          p.write_text(t, encoding='utf-8')

          insert_once(
              master,
              '### Engineering gates\n',
              '''### Authoritative outcome events для UI і motion\n\nPhase 1 повинна створити безпечні server-confirmed triggers для майбутніх анімацій нагород і перемог:\n\n- stable result/event ID для completion, reward, purchase, achievement, level, rank і competitive outcome;\n- idempotency і replay protection;\n- повторний request, reconnect або retry не створює другий event;\n- клієнт не може сам оголосити level up, rank up, entitlement, Kahoot victory або «Мільйонер» victory;\n- authoritative response містить final state і delta;\n- audit timestamps дозволяють відрізнити нову подію від повторно доставленої.\n\nPhase 1 не реалізує повний візуальний motion, але без цього фундаменту Phase 3/5/6 не мають права запускати фінальні celebrations.\n\n'''
          )

          insert_once(
              master,
              '### Deployment\n',
              '''### Typed outcome і motion event contracts\n\nPhase 2 визначає typed contracts, які UI використовує без дублювання бізнес-логіки:\n\n- `ProgressionOutcome`;\n- `EconomyOutcome`;\n- `GameOutcome`;\n- `AchievementGrantEvent`;\n- `LevelChangedEvent`;\n- `RankChangedEvent`;\n- `EntitlementGrantedEvent`;\n- stable `eventId`, `occurredAt`, `previousState`, `nextState`, `delta`;\n- server-time contract для multiplayer timers;\n- persisted consumed-event marker або equivalent deduplication;\n- schema для motion intensity preference.\n\nUI може вибирати presentation sequence, але не переобчислює final outcome.\n\n'''
          )

          insert_once(
              master,
              '## Контентна міграція\n',
              '''### Rebranding, theme і motion system\n\nPhase 3 обов’язково реалізує активні domain-специфікації:\n\n- [`PHASE_3_REBRANDING_AND_THEME_SYSTEM.md`](./PHASE_3_REBRANDING_AND_THEME_SYSTEM.md);\n- [`DESIGN_RULES.md`](./DESIGN_RULES.md);\n- [`MOTION_SYSTEM.md`](./MOTION_SYSTEM.md).\n\nДо scope входять:\n\n- канонічні motion tokens, easing і distance;\n- route/tab/fullscreen transitions;\n- sheets і dialogs;\n- loading/skeleton/data transitions;\n- correct/wrong answer sequences;\n- progress і animated numbers;\n- lesson/practice completion;\n- level up, rank up, achievement і streak;\n- theme switching без flash;\n- shared celebration layer;\n- reduced/minimal motion;\n- haptic preference;\n- authoritative event deduplication на клієнті;\n- visual regression fixtures для critical flows.\n\nMotion має відчуватися як calm premium SaaS interaction design, а не arcade decoration. Повний contract, timings, sequences, fallbacks і phase allocation містяться тільки в `MOTION_SYSTEM.md`.\n\n'''
          )

          insert_once(
              master,
              '## Legacy content cleanup\n',
              '''## Content Studio motion\n\nPhase 4 використовує restrained productivity motion:\n\n- job state transitions відображають реальний queued/running/review/failed/completed state;\n- не показувати fake percentage progress;\n- diff, validation і review panels використовують shared UI motion;\n- Scripture review surfaces не мають decorative motion;\n- AI generation completion не подається як духовна або доктринальна перемога;\n- reduced motion і keyboard/focus behavior є обов’язковими.\n\n'''
          )

          insert_once(
              master,
              '## Acceptance criteria\n\n- social data зберігається в production DB;',
              '''## Social і multiplayer motion\n\nPhase 5 реалізує server-backed motion для:\n\n- community join/leave і member count;\n- activity feed;\n- friend challenge send/accept;\n- leaderboard reordering;\n- Kahoot lobby, participant join, countdown, timer, answer reveal, intermediate leaderboard і final podium;\n- respectful result state для non-winners;\n- reconnect і room recovery без повторного відтворення старої victory animation.\n\nTimer і score синхронізуються із сервером. Final podium/victory запускаються лише для нового authoritative `GameOutcome.eventId`.\n\n'''
          )

          insert_once(
              master,
              '## Real payments\n',
              '''## Shop, entitlement і theme motion\n\nPhase 6 реалізує:\n\n- store entrance і catalog states;\n- theme preview;\n- flash-free apply owned theme;\n- purchase pending;\n- server-confirmed balance update;\n- entitlement reveal;\n- insufficient balance;\n- restore/refund/reversal states;\n- Stars/payment success лише після verified callback і reconciliation.\n\nЗаборонена оптимістична purchase celebration. Duplicate purchase/result не може запускати motion двічі.\n\n'''
          )

          insert_once(
              master,
              '## Rollout\n',
              '''## Motion performance і accessibility hardening\n\nPhase 7 завершує motion як production capability:\n\n- frame profiling у Telegram Android/iOS;\n- low-end device tier;\n- reduced/minimal motion audit;\n- performance budgets;\n- no CLS;\n- interruption, background restore і reconnect tests;\n- timer/listener cleanup;\n- ARIA announcements і focus restoration;\n- visual regression для major sequences;\n- no duplicate celebration;\n- particle/bundle budgets.\n\nRelease candidate не проходить Phase 7, якщо core UI зрозумілий лише з animation або великі sequences блокують navigation.\n\n'''
          )

          replace_once(
              master,
              '- optional integrations.\n',
              '- optional integrations;\n- richer theme-specific celebration packs;\n- advanced optional sound design;\n- classroom/presentation motion presets;\n- seasonal motion only після performance/accessibility review.\n'
          )

          insert_once(
              master,
              '## 8.5. Дизайн-система\n',
              '''## 8.4.1. Motion system\n\n`MOTION_SYSTEM.md` є джерелом правди для animation behavior. Motion не може визначатися випадковими inline transitions у конкретних компонентах. Великі reward, purchase і competitive celebrations запускаються лише authoritative events; усі critical sequences мають reduced-motion fallback.\n\n'''
          )

          phase3 = 'docs/PHASE_3_REBRANDING_AND_THEME_SYSTEM.md'
          replace_once(
              phase3,
              '**Пов’язаний документ:** [`DESIGN_RULES.md`](./DESIGN_RULES.md)  ',
              '**Пов’язані документи:** [`DESIGN_RULES.md`](./DESIGN_RULES.md), [`MOTION_SYSTEM.md`](./MOTION_SYSTEM.md)  '
          )
          insert_once(
              phase3,
              '# 16. Accessibility\n',
              '''## 15.3. Канонічна motion-специфікація\n\nПовні transitions, timings, correct/wrong sequences, level/rank/achievement celebrations, Kahoot/«Мільйонер», authoritative triggers, reduced motion, low-end rules і phase allocation визначені в [`MOTION_SYSTEM.md`](./MOTION_SYSTEM.md).\n\nPhase 3 повинна реалізувати motion foundation і core learning/account sequences. Multiplayer-specific sequences завершуються в Phase 5, purchase/payment sequences — у Phase 6, production hardening — у Phase 7. Заборонено локально змінювати цей розподіл без оновлення canonical docs.\n\n'''
          )
          insert_once(
              phase3,
              '# 22. Acceptance criteria Phase 3: rebranding\n',
              '''# 21.4. Motion rollout\n\nMotion rollout використовує ті самі feature flags, internal preview, closed alpha і rollback principles, що й visual rebrand. Rollback не може повторно запускати consumed celebrations, втрачати motion preference або змінювати authoritative progress/economy state.\n\n'''
          )

          design = 'docs/DESIGN_RULES.md'
          replace_once(
              design,
              '> **Повна Phase 3 специфікація:** [`PHASE_3_REBRANDING_AND_THEME_SYSTEM.md`](./PHASE_3_REBRANDING_AND_THEME_SYSTEM.md)\n',
              '> **Повна Phase 3 специфікація:** [`PHASE_3_REBRANDING_AND_THEME_SYSTEM.md`](./PHASE_3_REBRANDING_AND_THEME_SYSTEM.md)  \n> **Канонічна motion-система:** [`MOTION_SYSTEM.md`](./MOTION_SYSTEM.md)\n'
          )
          insert_once(
              design,
              '# 4. Primary Theme — «Світло»\n',
              '''# 3.5. Motion relationship\n\n`DESIGN_RULES.md` визначає вигляд станів, а `MOTION_SYSTEM.md` — їхню зміну в часі. Компонент не може вводити власні easing, celebration або correct/wrong sequence, якщо shared motion contract уже існує. Theme може змінювати палітру particles/glow, але не semantics, critical durations, reduced-motion behavior або blocking time.\n\n'''
          )

          prompt = 'docs/AI_AGENT_MASTER_EXECUTION_PROMPT.md'
          replace_once(
              prompt,
              '6. усі активні domain-документи, на які посилається вибрана фаза\n7. docs/archive/CURRENT_STATE_AUDIT.md лише як історичний baseline',
              '6. усі активні domain-документи, на які посилається вибрана фаза\n7. docs/MOTION_SYSTEM.md для будь-якої фази, що змінює UI, rewards, games, social, shop або performance\n8. docs/archive/CURRENT_STATE_AUDIT.md лише як історичний baseline'
          )
          insert_once(
              prompt,
              'CODE QUALITY\n',
              '''MOTION І FEEDBACK\n\n- Використовуй лише канонічні tokens, presets і sequences з docs/MOTION_SYSTEM.md.\n- Не змішуй `framer-motion` і `motion/react`.\n- Final reward, entitlement, level, rank, score або victory animation запускається тільки після authoritative event.\n- Кожна велика celebration має stable event ID і не replay-иться після retry/reconnect/remount.\n- Реалізуй reduced/minimal motion разом із default behavior.\n- Не використовуй confetti для routine success і не блокуй CTA завершенням particles.\n- Перевір interruption, cleanup, focus, ARIA announcement, Telegram Android/iOS і low-end behavior.\n\n'''
          )

          decisions = 'docs/DECISIONS.md'
          insert_once(
              decisions,
              '# Як додавати нові рішення\n',
              '''# ADR-010 — Одна канонічна motion-система з authoritative celebrations\n\n**Дата:** 2026-08-02  \n**Статус:** accepted, implementation distributed across Phase 1–7  \n**Деталі:** [`MOTION_SYSTEM.md`](./MOTION_SYSTEM.md)\n\n## Контекст\n\nПроєкт уже має `framer-motion`, shared variants, MotionSheet і MotionDialog, але без повного contract майбутні екрани можуть отримати різні easing, надмірні celebrations, duplicate animation після reconnect або оптимістичну анімацію непідтвердженої нагороди.\n\n## Рішення\n\n- motion Bible Games має характер calm premium SaaS interaction design;\n- `MOTION_SYSTEM.md` є єдиним domain source of truth;\n- зберігається один animation package;\n- routine motion стриманий, major celebration дозволена лише для рідкісної важливої події;\n- final reward/purchase/competitive motion запускається лише authoritative event;\n- stable event ID запобігає replay;\n- reduced/minimal motion обов’язковий;\n- themes можуть змінювати decorative palette, але не semantics і critical behavior;\n- Phase 1–2 створюють event foundation, Phase 3 — core motion, Phase 5 — social/multiplayer, Phase 6 — economy/shop, Phase 7 — release hardening.\n\n## Наслідки\n\nПозитивні:\n\n- один motion language;\n- premium відчуття без arcade noise;\n- менший ризик duplicate celebration і fake success;\n- accessibility та performance перевіряються системно.\n\nНегативні:\n\n- implementation розподілена між фазами;\n- потрібні visual fixtures і authoritative event contracts;\n- частину legacy inline motion доведеться мігрувати.\n\n## Rollback\n\nVisual motion може бути feature-flagged або reduced до opacity-only, але rollback не може повертати client-authoritative rewards, дублювання events або відсутність reduced-motion support.\n\n---\n\n'''
          )

          # Self-delete after successful transformation.
          workflow = Path('.github/workflows/temp-motion-doc-sync.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: synchronize motion system across phases"
          git push origin HEAD:agent/unify-product-documentation
